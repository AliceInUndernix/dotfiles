; Flameshot settings (linked to ~/.config/flameshot/flameshot.ini).
; In dwm, Print opens the selection tool (Enter or Ctrl+C copies,
; Ctrl+S saves) and Mod+Print copies the whole screen.
; Changing settings in Flameshot's own window writes back to this file.
[General]
; Habamax colours: blue for the selection frame, red for drawing.
uiColor=#5f87af
contrastUiColor=#1c1c1c
drawColor=#af5f5f
; No tray icon, welcome message or help overlay: just take the shot.
disabledTrayIcon=true
showStartupLaunchMessage=false
showHelp=false
showDesktopNotification=false
; Saved shots are PNGs named by date and time (in ~/Pictures by default).
filenamePattern=%F_%H-%M-%S
saveAsFileExtension=png
