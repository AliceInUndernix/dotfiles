# mpv settings (this folder is linked to ~/.config/mpv).

# Picture: good scaling, hardware decoding when it is safe.
profile=high-quality
vo=gpu-next
hwdec=auto-safe

# Remember where you stopped, and start there next time.
save-position-on-quit=yes
# Stay on the last frame instead of closing when a file ends.
keep-open=yes

# Window: no border (dwm draws one), start at most 60% of the screen.
border=no
autofit-larger=60%x60%

# Audio: louder than 100% allowed, start at 100.
volume=100
volume-max=150

# Subtitles and audio: English first, load subtitle files next to the video.
slang=en,eng
alang=en,eng
sub-auto=fuzzy

# Text in Habamax colours and Liberation Mono, like the rest of the desktop.
osd-font="Liberation Mono"
osd-font-size=28
osd-color="#c7c7c7"
osd-border-color="#1c1c1c"
sub-font="Liberation Sans"
sub-color="#eeeeee"
sub-border-color="#1c1c1c"

# Screenshots (s) go to your home folder as PNG.
screenshot-directory=~
screenshot-format=png
screenshot-template="%F-%P"

# Online video (needs yt-dlp): at most 1080p.
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
