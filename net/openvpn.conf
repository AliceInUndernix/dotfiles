# OpenVPN settings for Riseup, from net/openvpn.conf. vpn adds the
# "remote" lines of the server it picked and runs OpenVPN itself (no
# openvpn.* service). Installed as /etc/vpn/openvpn.conf.
# Based on the settings in BarbossHack's RiseupVPN-OpenVPN, which
# are tested against Riseup's servers.

client
dev tun
proto tcp
nobind
persist-key

# Give up quickly, so vpn can try again or pick another server.
pull-filter ignore "ping"
pull-filter ignore "ping-restart"
pull-filter ignore "keepalive"
keepalive 10 20
server-poll-timeout 10
connect-retry 1 2
connect-retry-max 1

cipher AES-256-GCM
data-ciphers AES-256-GCM
remote-cert-tls server

# IPv4 only: IPv6 is off on this machine.
pull-filter ignore "tun-ipv6"
pull-filter ignore "route-ipv6"
pull-filter ignore "ifconfig-ipv6"
pull-filter ignore "redirect-gateway"
pull-filter ignore "block-outside-dns"
redirect-gateway def1

# vpn learns the VPN's DNS server from these (it is used only before
# Tor runs: for the speed test, the clock and renewing the certificate).
script-security 2
up "/usr/local/bin/vpn up-hook"
down "/usr/local/bin/vpn down-hook"

ca /etc/vpn/ca.crt
cert /etc/vpn/client.crt
key /etc/vpn/client.key

verb 1
