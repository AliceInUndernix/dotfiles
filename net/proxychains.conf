# proxychains-ng for net/ (vpn): "proxychains program" runs a program
# through Tor. Installed as /etc/proxychains.conf.
# For I2P instead of Tor, change the last line to: http 127.0.0.1 4444

strict_chain
# names are looked up by the proxy (Tor), never here
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000
# no proxy for this machine itself
localnet 127.0.0.0/255.0.0.0

[ProxyList]
socks5 127.0.0.1 9050
