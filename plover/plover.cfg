# Plover's settings for a new install (install.sh copies this to
# ~/.system/plover/plover.cfg if there is none yet; Plover rewrites the
# file itself, so it is a copy, not a link).
[Machine Configuration]
machine_type = Gemini PR
auto_start = True

[Gemini PR]
port = /dev/ttyACM0

[System]
name = Dotterel

[Plugins]
enabled_extensions = ["plover_auto_reconnect_machine"]
