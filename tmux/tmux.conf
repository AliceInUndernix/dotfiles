# Minimal tmux config. Close to tmux defaults; prefix stays Ctrl-b.
# Installed as ~/.config/tmux/tmux.conf (tmux 3.1+ reads it there).
# Reload after editing: prefix then :source-file ~/.config/tmux/tmux.conf

# Colours: tell programs inside tmux they have 256 colours, and pass
# true colour through from st (Neovim's habamax looks right then).
set -g default-terminal "tmux-256color"
set -as terminal-features ",st-256color:RGB,xterm-256color:RGB"

# No delay after Esc, so Neovim leaves insert mode at once.
set -sg escape-time 0
# Let Neovim notice focus changes (reloads files changed outside it).
set -g focus-events on

# Windows and panes count from 1, like the keys on the number row.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Longer scrollback; vi keys in copy mode (prefix [ to enter).
set -g history-limit 50000
setw -g mode-keys vi

# Mouse: the wheel scrolls back through the pane's history (like st
# outside tmux), click picks a pane, drag resizes; Shift+drag selects
# text the st way.
set -g mouse on

# Colours: Neovim's Habamax, toned down. The status bar reads like plain
# text on the terminal background: session and other windows in dim grey,
# the current window in normal text with its number in Habamax's teal.
set -g status-style "bg=default,fg=#767676"
set -g status-left "#[fg=#585858]#S  "
set -g status-left-length 20
set -g status-right ""
setw -g window-status-separator "  "
setw -g window-status-format "#[fg=#585858]#I #[fg=#767676]#W"
setw -g window-status-current-format "#[fg=#87afaf]#I #[fg=#bcbcbc]#W"
setw -g window-status-activity-style "fg=#af875f"
setw -g window-status-bell-style "fg=#af5f5f"

# Pane borders: dark lines, the active one a step lighter.
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#585858"
set -g display-panes-colour "#585858"
set -g display-panes-active-colour "#87afaf"

# Messages, prompt and menus.
set -g message-style "bg=default,fg=#bcbcbc"
set -g message-command-style "bg=default,fg=#bcbcbc"
set -g menu-style "bg=#3a3a3a,fg=#bcbcbc"
set -g menu-selected-style "bg=#585858,fg=#eeeeee"
set -g menu-border-style "fg=#3a3a3a"
set -g popup-border-style "fg=#585858"

# Copy mode: selection and search in Habamax's Visual/Search colours,
# one shade darker.
setw -g mode-style "bg=#5f8787,fg=#1c1c1c"
setw -g copy-mode-match-style "bg=#5f875f,fg=#1c1c1c"
setw -g copy-mode-current-match-style "bg=#afaf87,fg=#1c1c1c"
setw -g clock-mode-colour "#87afaf"
