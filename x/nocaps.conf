# No Caps Lock, on every keyboard (the laptop's, the Moonlander, any
# other one plugged in). The Caps Lock key does nothing, and no key or
# program can turn Caps Lock on: the key map has no Caps Lock at all.
# Linked as /etc/X11/xorg.conf.d/90-nocaps.conf by a root run of
# ./install.sh x (su -c './install.sh x'). X reads it when it starts.
# To get Caps Lock back: ./install.sh uninstall x as root, then
# restart X.
Section "InputClass"
	Identifier "no caps lock"
	MatchIsKeyboard "on"
	Option "XkbOptions" "caps:none"
EndSection
